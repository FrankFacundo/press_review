name: Desktop Packages

on:
  workflow_dispatch:
    inputs:
      target:
        description: Which desktop package to build
        required: true
        default: all
        type: choice
        options:
          - all
          - linux
          - windows

jobs:
  build-linux:
    if: ${{ inputs.target == 'all' || inputs.target == 'linux' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[packaging]"
      - name: Prepare Playwright Cache
        run: python -m luxnews.cli install-playwright
      - name: Build Linux Artifact
        run: python scripts/build_desktop.py --target linux
      - uses: actions/upload-artifact@v4
        with:
          name: LuxNews-linux
          path: dist/linux/LuxNews
          if-no-files-found: error

  build-windows:
    if: ${{ inputs.target == 'all' || inputs.target == 'windows' }}
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[packaging]"
      - name: Prepare Playwright Cache
        shell: pwsh
        run: python -m luxnews.cli install-playwright
      - name: Build Windows Artifact
        shell: pwsh
        run: python scripts/build_desktop.py --target windows
      - uses: actions/upload-artifact@v4
        with:
          name: LuxNews-windows
          path: dist/windows/LuxNews.exe
          if-no-files-found: error
